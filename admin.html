<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Rodrigue DOULGUE</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-box {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(45,10,94,0.2);
        }
        .admin-panel { display: none; }
        .tab-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .tab-btn { background: #2d0a5e; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; }
        .tab-btn.active { background: #FFD700; color: #2d0a5e; font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .visiteur-card { background: #f8f4ff; border-radius: 10px; padding: 15px; margin-bottom: 10px; border-left: 4px solid #FFD700; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-box { background: linear-gradient(135deg,#1a0533,#2d0a5e); color: white; padding: 20px; border-radius: 10px; text-align: center; }
        .stat-box h3 { font-size: 36px; color: #FFD700; }
        .produit-form input, .produit-form textarea, .produit-form select { width: 100%; padding: 10px; margin-bottom: 10px; border: 2px solid #eee; border-radius: 8px; font-size: 14px; }
        .produit-admin-card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 10px; border-left: 4px solid #2d0a5e; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    </style>
</head>
<body style="background: linear-gradient(135deg, #1a0533, #2d0a5e); min-height:100vh;">

<div class="login-box" id="loginBox">
    <h2 style="text-align:center; color:#2d0a5e; margin-bottom:20px;">🔐 Espace Admin</h2>
    <p style="text-align:center; color:#666; margin-bottom:20px;">Rodrigue DOULGUE</p>
    <input type="password" id="motdepasse" placeholder="Mot de passe" style="width:100%;padding:12px;border:2px solid #eee;border-radius:10px;font-size:15px;margin-bottom:15px;">
    <button onclick="verifierMdp()" class="btn" style="width:100%;">Se connecter</button>
    <p id="erreur" style="color:red;text-align:center;margin-top:10px;"></p>
</div>

<div class="admin-panel" id="adminPanel">
    <header>
        <nav>
            <div class="logo">🔐 Admin - Rodrigue DOULGUE</div>
            <ul>
                <li><a href="index.html">Voir le site</a></li>
                <li><a href="#" onclick="deconnexion()" style="color:#ff4444;">Déconnexion</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1 style="margin-bottom:20px; color:white;">Tableau de bord</h1>
        <div class="stats-grid">
            <div class="stat-box"><h3 id="nb-visiteurs">0</h3><p>Visiteurs</p></div>
            <div class="stat-box"><h3 id="nb-pays">0</h3><p>Pays</p></div>
            <div class="stat-box"><h3 id="nb-produits">0</h3><p>Produits</p></div>
        </div>
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="showTab('visiteurs', this)">👥 Visiteurs</button>
            <button class="tab-btn" onclick="showTab('produits', this)">🛍️ Gérer Produits</button>
            <button class="tab-btn" onclick="showTab('ajouter', this)">➕ Ajouter Produit</button>
        </div>

        <div class="tab-content active" id="tab-visiteurs">
            <div class="section">
                <h2>👥 Historique des Visiteurs</h2>
                <div id="liste-visiteurs"><p>Chargement...</p></div>
            </div>
        </div>

        <div class="tab-content" id="tab-produits">
            <div class="section">
                <h2>🛍️ Produits publiés</h2>
                <div id="liste-produits-admin"><p>Chargement...</p></div>
            </div>
        </div>

        <div class="tab-content" id="tab-ajouter">
            <div class="section">
                <h2>➕ Ajouter un produit</h2>
                <div class="produit-form">
                    <input type="text" id="prod-titre" placeholder="Titre du produit *">
                    <textarea id="prod-desc" placeholder="Description du produit *" rows="3"></textarea>
                    <input type="text" id="prod-prix" placeholder="Prix (ex: 25000 FCFA) *">
                    <select id="prod-cat">
                        <option value="livres">📚 Livre</option>
                        <option value="formations">🎓 Formation</option>
                        <option value="outils">🛠️ Outil</option>
                        <option value="coaching">⭐ Coaching</option>
                    </select>
                    <input type="text" id="prod-image" placeholder="URL de l'image (optionnel)">
                    <input type="text" id="prod-video" placeholder="URL de la vidéo YouTube (optionnel)">
                    <button onclick="ajouterProduit()" class="btn" style="width:100%;">Publier le produit</button>
                    <p id="msg-produit" style="color:green; margin-top:10px; text-align:center;"></p>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
const MOT_DE_PASSE = "rodrigue2026";
const BIN_VISITEURS = "69c23186c3097a1dd55429f2";
const API_KEY = "$2a$10$tbe9LcZbefI37jzYZa7qMurmA3RYF3OLoIhb2vs5CyBUJKoGKLSjC";
const BIN_PRODUITS_KEY = "rodrigue_produits";

function verifierMdp() {
    if (document.getElementById("motdepasse").value === MOT_DE_PASSE) {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("adminPanel").style.display = "block";
        chargerVisiteurs();
        chargerProduits();
    } else {
        document.getElementById("erreur").textContent = "Mot de passe incorrect !";
    }
}

function deconnexion() {
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("adminPanel").style.display = "none";
}

function showTab(tab, btn) {
    document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.getElementById("tab-" + tab).classList.add("active");
    btn.classList.add("active");
}

async function chargerVisiteurs() {
    try {
        const res = await fetch("https://api.jsonbin.io/v3/b/" + BIN_VISITEURS + "/latest", {
            headers: { "X-Master-Key": API_KEY }
        });
        const data = await res.json();
        const visiteurs = data.record.visiteurs || [];
        document.getElementById("nb-visiteurs").textContent = visiteurs.length;
        const pays = [...new Set(visiteurs.map(v => v.pays))];
        document.getElementById("nb-pays").textContent = pays.length;
        const liste = document.getElementById("liste-visiteurs");
        if (visiteurs.length === 0) { liste.innerHTML = "<p>Aucun visiteur.</p>"; return; }
        liste.innerHTML = "";
        visiteurs.reverse().forEach((v, i) => {
            liste.innerHTML += `<div class="visiteur-card">
                <p><strong>#${i+1}</strong> | ⏰ ${v.heure}</p>
                <p>🌍 ${v.pays} — 🏙️ ${v.ville}</p>
                <p>📄 Page: ${v.page}</p>
            </div>`;
        });
    } catch(e) {
        document.getElementById("liste-visiteurs").innerHTML = "<p>Erreur chargement.</p>";
    }
}

function getProduits() {
    const data = localStorage.getItem(BIN_PRODUITS_KEY);
    return data ? JSON.parse(data) : [];
}

function saveProduits(produits) {
    localStorage.setItem(BIN_PRODUITS_KEY, JSON.stringify(produits));
}

function chargerProduits() {
    const produits = getProduits();
    document.getElementById("nb-produits").textContent = produits.length;
    const liste = document.getElementById("liste-produits-admin");
    if (produits.length === 0) { liste.innerHTML = "<p>Aucun produit ajouté.</p>"; return; }
    liste.innerHTML = "";
    produits.forEach((p, i) => {
        liste.innerHTML += `<div class="produit-admin-card">
            <h3>${p.titre}</h3>
            <p>${p.description}</p>
            <p><strong>Prix:</strong> ${p.prix} | <strong>Catégorie:</strong> ${p.categorie}</p>
            <button onclick="supprimerProduit(${i})" style="background:red;color:white;padding:6px 15px;border:none;border-radius:5px;cursor:pointer;margin-top:8px;">Supprimer</button>
        </div>`;
    });
}

function ajouterProduit() {
    const titre = document.getElementById("prod-titre").value;
    const desc = document.getElementById("prod-desc").value;
    const prix = document.getElementById("prod-prix").value;
    const cat = document.getElementById("prod-cat").value;
    const image = document.getElementById("prod-image").value;
    const video = document.getElementById("prod-video").value;
    if (!titre || !desc || !prix) { alert("Remplissez les champs obligatoires !"); return; }
    const produits = getProduits();
    produits.push({ titre, description: desc, prix, categorie: cat, image, video, date: new Date().toLocaleString("fr-FR") });
    saveProduits(produits);
    document.getElementById("msg-produit").textContent = "✅ Produit ajouté avec succès !";
    document.getElementById("prod-titre").value = "";
    document.getElementById("prod-desc").value = "";
    document.getElementById("prod-prix").value = "";
    document.getElementById("prod-image").value = "";
    document.getElementById("prod-video").value = "";
    chargerProduits();
}

function supprimerProduit(index) {
    if (confirm("Supprimer ce produit ?")) {
        const produits = getProduits();
        produits.splice(index, 1);
        saveProduits(produits);
        chargerProduits();
    }
}
</script>
</body>
</html>
